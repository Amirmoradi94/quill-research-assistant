services:
  scraper:
    build: ./scraper
    image: postdoc-scraper:latest
    container_name: postdoc-scraper
    restart: unless-stopped
    # No external port exposure — only reachable by dashboard on the internal network

  dashboard:
    build:
      context: .
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
    image: postdoc-dashboard:latest
    container_name: postdoc-dashboard
    ports:
      - "${POSTDOC_DOCKER_PORT:-8010}:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - POSTDOC_DB=/app/data/postdoc.db
      - POSTDOC_STATIC_DIR=/app/static
      - POSTDOC_DISABLE_REPLY_POLLER=1
      - SCRAPER_URL=http://scraper:8001
      # Discovery v2 — non-secret defaults. Secret keys (OPENAI_API_KEY,
      # TAVILY_API_KEY / WEBSEARCH_API_KEY) live in .env (loaded via env_file).
      - OPENALEX_MAILTO=${OPENALEX_MAILTO:-quill@devnook.xyz}
      - WEBSEARCH_PROVIDER=${WEBSEARCH_PROVIDER:-tavily}
    depends_on:
      scraper:
        condition: service_healthy
